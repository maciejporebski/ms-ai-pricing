name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh pricing snapshot daily at 06:00 UTC.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let scheduled runs supersede each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch latest pricing snapshot
        run: npm run fetch-data

      - name: Unit tests (parser)
        run: npm run test:unit

      - name: Build site
        env:
          BASE_PATH: /
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
